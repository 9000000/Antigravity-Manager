name: Restore latest Docker tag

on:
  workflow_dispatch:

jobs:
  restore-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-point latest tags to v4.7.13
        run: |
          OWNER="${{ github.repository_owner }}"
          IMAGE="${OWNER}/antigravity-manager"
          STABLE="v4.7.13"

          docker buildx imagetools create -t ${IMAGE}:latest-amd64 ${IMAGE}:${STABLE}-amd64
          docker buildx imagetools create -t ${IMAGE}:latest-arm64 ${IMAGE}:${STABLE}-arm64
          docker buildx imagetools create -t ${IMAGE}:latest \
            ${IMAGE}:${STABLE}-amd64 \
            ${IMAGE}:${STABLE}-arm64

          echo "latest tags re-pointed to ${STABLE}"
